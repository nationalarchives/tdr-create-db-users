name: TDR Deploy Create Database Users Lambda
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment'
        required: true
        options:
          - intg
          - staging
          - prod
          - dev
          - drdev
        default: 'intg'
      keycloak-to-deploy:
        description: 'Keycloak user version to deploy'
        required: true
      db-to-deploy:
        description: 'DB users version to deploy'
        required: true
run-name: Deploying Create Database Users Lambdas ${{inputs.keycloak-to-deploy}} and ${{inputs.db-to-deploy}} to ${{inputs.environment}}
permissions: {}
jobs:
  deploy_keycloak_users:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_deploy.yml@5a96b84cf82bce1371168cc31cb89f88cad86763 # v0.0.53
    with:
      lambda-name: create-keycloak-user
      deployment-package: create-db-users.jar
      environment: ${{ github.event.inputs.environment }}
      to-deploy: ${{ github.event.inputs.keycloak-to-deploy }}
    secrets:
      ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
  deploy_db_users:
    needs: deploy_keycloak_users
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_deploy.yml@5a96b84cf82bce1371168cc31cb89f88cad86763 # v0.0.53
    with:
      lambda-name: create-db-users
      deployment-package: create-db-users.jar
      environment: ${{ github.event.inputs.environment }}
      to-deploy: ${{ github.event.inputs.db-to-deploy }}
    secrets:
      ACCOUNT_NUMBER: ${{ secrets.ACCOUNT_NUMBER }}
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
