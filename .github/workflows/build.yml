name: TDR Tag and pre deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment'
        required: true
        options:
          - intg
          - staging
          - prod
          - dev
          - drdev
        default: 'drdev'
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
      account-regional-code-bucket:
        description: 'Code bucket uses account regional namespace'
        type: boolean
        required: false
        default: false
permissions: { }
jobs:
  pre-deploy-keycloak-user:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@73f166c1ea66e46448b63d57a8c7c616d11ac180 # v0.0.46
    with:
      lambda-name: create-keycloak-user
      java-version: ${{vars.JAVA_RUNTIME}}
      repo-name: tdr-create-db-users
      artifact-name: create-db-users
      build-command: |
        sbt assembly
      account-regional-code-bucket: ${{ inputs.account-regional-code-bucket }}
      snapshot: ${{ inputs.snapshot }}
      environment: ${{ inputs.environment }}
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
  pre-deploy-db-users:
    needs: pre-deploy-keycloak-user
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@73f166c1ea66e46448b63d57a8c7c616d11ac180 # v0.0.46
    with:
      lambda-name: create-db-users
      java-version: ${{vars.JAVA_RUNTIME}}
      repo-name: tdr-create-db-users
      artifact-name: create-db-users
      build-command: |
        sbt assembly
      account-regional-code-bucket: ${{ inputs.account-regional-code-bucket }}
      snapshot: ${{ inputs.snapshot }}
      environment: ${{ inputs.environment }}
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
  deploy:
    needs: [pre-deploy-keycloak-user, pre-deploy-db-users]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: gh workflow run deploy.yml -f environment=drdev -f keycloak-to-deploy="$KEYCLOAK_VERSION" -f db-to-deploy="$DB_VERSION" -f account-regional-code-bucket=true
        env:
          KEYCLOAK_VERSION: ${{ needs.pre-deploy-keycloak-user.outputs.next-version }}
          DB_VERSION: ${{ needs.pre-deploy-db-users.outputs.next-version }}
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          SNAPSHOT: ${{ inputs.snapshot == true }}