name: TDR Tag and pre deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build a dev snapshot from the current branch instead of the next release version'
        type: boolean
        required: false
        default: false
      account-regional-code-bucket:
        description: 'Code bucket uses account regional namespace'
        type: boolean
        required: false
        default: false
permissions: {}
jobs:
  pre-deploy-keycloak-user:
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@660c4e820430fa17bedb491482072a065be85ed3 # v0.0.46
    with:
      lambda-name: create-keycloak-user
      java-version: ${{vars.JAVA_RUNTIME}}
      repo-name: tdr-create-db-users
      artifact-name: create-db-users
      build-command: |
        sbt assembly
      account-regional-code-bucket: ${{ inputs.account-regional-code-bucket }}
      snapshot: ${{ inputs.snapshot }}
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
  pre-deploy-db-users:
    needs: pre-deploy-keycloak-user
    permissions:
      id-token: write
      contents: write
    uses: nationalarchives/tdr-github-actions/.github/workflows/lambda_build.yml@660c4e820430fa17bedb491482072a065be85ed3 # v0.0.46
    with:
      lambda-name: create-db-users
      java-version: ${{vars.JAVA_RUNTIME}}
      repo-name: tdr-create-db-users
      artifact-name: create-db-users
      build-command: |
        sbt assembly
      account-regional-code-bucket: ${{ inputs.account-regional-code-bucket }}
      snapshot: ${{ inputs.snapshot }}
    secrets:
      MANAGEMENT_ACCOUNT: ${{ secrets.MANAGEMENT_ACCOUNT }}
      WORKFLOW_PAT: ${{ secrets.WORKFLOW_PAT }}
